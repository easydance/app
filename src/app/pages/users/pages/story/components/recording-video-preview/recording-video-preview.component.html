<div id="story"
	class="p-5">
	<div [ngStyle]="{ background: source && source.type == 'picture' ? 'url(data:image/jpeg;base64,' + source.src + ') center center no-repeat' : '' }"
		id="story-preview">
		<ion-fab-button *ngIf="source"
			(click)="searchUsersModal.present()"
			class="button m-3 w-9 h-9 absolute top-0 left-0 z-1010">
			<ion-icon name="person-add"
				style="font-size: 1rem;"></ion-icon>
		</ion-fab-button>
		<video *ngIf=" source && source.type == 'video'"
			class=" absolute top-0 left-0 z-1000"
			autoplay
			loop>
			<source [src]="source.src"
				type="video/mp4">
		</video>

		<div *ngIf="source && source.party"
			class="footer p-4">
			<div (click)="searchUsersModal.present()"
				class="mb-4">
				<users-widget [users]="source?.usersTags || []"
					[avatarShown]="5"
					style="zoom: 0.7"></users-widget>
			</div>

			<div class="flex space-between">
				<div>
					<ion-chip class="dark xl">
						<ion-icon color="light"
							name="location"></ion-icon>
						<ion-label>
							{{source.party.club.name}}
						</ion-label>
					</ion-chip>
					<div class="title mt-2">
						{{source.party.title}}
					</div>
				</div>
				<div class>
					<div class="stories-buttons">
						<ion-fab-button size="small">
							<ion-icon name="heart-outline"></ion-icon>
						</ion-fab-button>
						<!-- <ion-fab-button size="small">
							<ion-icon name="share-outline"></ion-icon>
						</ion-fab-button> -->
						<ion-fab-button size="small">
							<ion-icon name="ellipsis-vertical"></ion-icon>
						</ion-fab-button>
					</div>

				</div>
			</div>
		</div>
	</div>
	<div *ngIf="!source">
		<div></div>
		<div [ngClass]="{'recording': recording}"
			(touchstart)="startEvent()"
			(touchend)="endEvent()"
			id="play-button"
			class="w-14 h-14">
			<div></div>
		</div>
		<!-- <div [ngClass]="{'recording': recording}"
			(click)="recording ? stopVideo() : recordVideo()"
			id="play-button"
			class="w-14 h-14">
			<div></div>
		</div> -->
	</div>
	<div *ngIf="source"
		class="buttons">
		<ion-button (click)="initializeCameraPreview()"
			class="flex-1"
			shape="round"
			expand="block"
			color="neutral-500">
			Indietro
		</ion-button>
		<ion-button (click)="goNext()"
			class="flex-1"
			shape="round"
			expand="block"
			color="primary">
			Avanti
		</ion-button>
	</div>
</div>

<ion-modal #searchClubModal
	class="auto-height bottom blur">
	<ng-template>
		<ion-searchbar [showClearButton]="'always'"
			[debounce]="500"
			[placeholder]="'Cerca party...'"
			(ionInput)="searchClubs($event)"
			class="my-2"
			clearIcon="close-outline"></ion-searchbar>
		<ion-list *ngIf="source">
			<ion-item *ngFor="let party of parties"
				(click)="source.party = party; searchClubModal.dismiss()">
				<ion-label>
					<div>
						{{party.club?.name}}
					</div>
					<small>{{party.title}}</small>
				</ion-label>
			</ion-item>
		</ion-list>
	</ng-template>
</ion-modal>

<ion-modal #searchUsersModal
	class="auto-height bottom blur">
	<ng-template>
		<ion-searchbar [showClearButton]="'always'"
			[debounce]="500"
			[placeholder]="'Cerca amici...'"
			(ionInput)="searchUsers($event)"
			class="my-2"
			clearIcon="close-outline"></ion-searchbar>
		<div id="users-grid">
			<div *ngFor="let user of users"
				[ngClass]="{ selected: isUserSelected(user)  }"
				(click)="toggleUser(user)"
				class="user-item">
				<div>
					<ion-avatar style="margin: 0 auto;">
						<img [src]="user.profileImage?.url || 'assets/icons/guy-walk.svg'"
							style="object-fit: cover;"
							onerror="src = 'assets/icons/guy-walk.svg'; style.objectFit = 'contain'">
					</ion-avatar>
					<div class="mt-1"
						style="text-align: center;">
						<small>
							{{user.firstName}} {{user.lastName}}
						</small>
					</div>

				</div>
			</div>
		</div>
		<div class="flex space-between my-8">
			<ion-button (click)="searchUsersModal.dismiss()"
				class="flex-1"
				shape="round"
				color="dark">
				CHIUDI
			</ion-button>
			<ion-button (click)="insertUsers();searchUsersModal.dismiss();"
				class="flex-1"
				shape="round"
				color="primary">
				Inserisci
			</ion-button>
		</div>
	</ng-template>
</ion-modal>
