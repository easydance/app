<ion-content [fullscreen]="true"
	[swipe]
	(swipeDown)="close()"
	id="stories-content">
	<div class="header px-4">
		<div class="flex align-center"
			style="flex-direction: row-reverse;">
			<div (click)="close()"
				class="flex align-center gap-1 mb-1">
				<ion-icon name="close"></ion-icon>
				chiudi
			</div>
		</div>
		<div class="pager flex item-center gap-1 px-1">
			<div *ngFor="let story of stories; let i = index"
				[ngClass]="{ 'active': i < currentIndex }">
				<ion-progress-bar *ngIf="i < currentIndex"
					[value]="1"
					color="light"></ion-progress-bar>
				<ion-progress-bar *ngIf="i == currentIndex"
					[value]="currentProgress"
					color="light"></ion-progress-bar>
			</div>
		</div>
	</div>
	<swiper-container #swiper
		*ngIf="stories"
		id="stories-slider"
		allow-touch-move="false">
		<swiper-slide *ngFor="let story of stories"
			[id]="'story-' + story.id"
			[swipe]
			(swipeDown)="close()"
			(swipeRight)="close({}, 'NEXT_USER');"
			(swipeLeft)="close({}, 'PREVIOUS_USER')"
			(touchstart)="pause()"
			(touchend)="resume()">
			<div class="header px-4">
				<div class="flex space-between mt-9">
					<ion-chip [outline]="true"
						color="light">
						Start {{story.party.from | date:'HH:mm'}}
					</ion-chip>
					<ion-chip [outline]="true"
						color="light">
						End {{story.party.to | date:'HH:mm'}}
					</ion-chip>
				</div>
			</div>
			<div *ngIf="isImage(story)"
				[ngStyle]="{ 'background': 'url('+ story.attachment.url +') top center no-repeat', 'background-size': 'contain' }"
				class="z-500"
				id="img-story"></div>
			<video #video
				*ngIf="!isImage(story)"
				[attr.webkit-playsinline]="'webkit-playsinline'"
				[controls]="false"
				(click)="video.paused? video.play() : video.pause()"
				autoplay
				class="z-500"
				poster="assets/icons/loading.svg"
				playsinline>
				<source [src]="story.attachment.url"
					[type]="story.attachment.mimeType">
				Your browser does not support the video tag.
			</video>
			<div class="absolute w-full h-full top-0 left-0 flex items-center z-510">
				<div (click)="prev()"
					id="prev-story"
					class="flex-1"></div>
				<div (click)="next()"
					id="next-story"
					class="flex-1"></div>
			</div>

			<div class="footer p-4 z-600">
				<div (click)="openUserTagged(friendsModal.modal!)"
					class="mb-4 flex align-center space-between">
					<div>
						<users-widget *ngIf="story.userTags?.length"
							[users]="(story.userTags || []) | bypassTyping"
							[avatarShown]="5"
							(click)="friendsModal.modal?.present()"
							style="zoom: 0.5"></users-widget>
						<follower-modal #friendsModal
							*ngIf="story.userTags?.length"
							[options]="{ disableUserRouting: false, autoClose: false }"
							[followers]="story.userTags"
							[title]="'Amici taggati'"></follower-modal>
					</div>
				</div>

				<div class="flex space-between gap-2">
					<div>
						<ion-chip (click)="openClubDetails(story.party.club)"
							class="dark xl"
							style="zoom: 0.8">
							<ion-icon color="light"
								name="location"></ion-icon>
							<ion-label>
								{{getClubName(story) || '-'}}
							</ion-label>
						</ion-chip>
						<div (click)="openPartyDetails(story.party)"
							class="title mt-2">
							{{story.party.title}}
						</div>
						<div class="flex mt-2">
							<div (click)="openUserProfile(story.user!)"
								class="flex align-center gap-2">
								<div>
									<small>da</small>
								</div>
								<ion-avatar class="w-5 h-5"
									style="margin: 0 auto;">
									<img [src]="story.user?.profileImage?.url"
										onerror="src = 'assets/icons/guy-walk.svg'; style.objectFit = 'contain'"
										style="object-fit: cover;">
								</ion-avatar>
								<div style="text-align: center;">
									<small>
										{{story.user?.firstName}} {{story.user?.lastName}}
									</small>
								</div>
							</div>
						</div>
					</div>
					<div class>
						<div class="stories-buttons">
							<ion-fab-button (click)="toggleLike(story)"
								size="small">
								<ion-icon [name]="story.liked ? 'heart' : 'heart-outline'"></ion-icon>
								<small *ngIf="story.likes">
									{{story.likes | shorterNumber}}
								</small>
							</ion-fab-button>
							<ion-fab-button (click)="share(story)"
								size="small">
								<ion-icon name="share-outline"></ion-icon>
							</ion-fab-button>
							<!-- <ion-fab-button size="small">
							<ion-icon name="ellipsis-vertical"></ion-icon>
						</ion-fab-button> -->
							<ion-fab-button *ngIf="story.createdBy && authManager.user?.uuid && story.createdBy == authManager.user?.uuid"
								(click)="pause();modal.present();"
								size="small">
								<ion-icon name="trash-outline"></ion-icon>
							</ion-fab-button>
						</div>

					</div>
				</div>
			</div>
			<follower-modal #friendsModal
				[followers]="story.userTags | bypassTyping"
				[title]="'Amici taggati'"
				(userClick)="openUserProfile($event)"></follower-modal>

		</swiper-slide>
	</swiper-container>
	<div *ngIf="!stories"
		id="loading-stories">
		<easy-thats-all [message]="'Caricamento...'"></easy-thats-all>
	</div>
	<div *ngIf="stories && stories.length"
		(swipeDown)="close()"
		swipe
		id="no-stories">
		<easy-thats-all [message]="'Non ci sono storie per ora...'"></easy-thats-all>
	</div>
</ion-content>

<ion-modal #modal
	(didDismiss)="resume();"
	id="full-immersion-modal"
	trigger="open-custom-dialog">
	<ng-template>
		<div class="wrapper p-8">
			<div class="title">Elimina storia</div>
			<div class="my-10 subtitle">
				Sei sicuro di voler eliminare la storia?
			</div>
			<div style="display: flex; align-items: center; gap: 1rem">
				<ion-button (click)="modal.dismiss()"
					shape="round"
					color="dark"
					expand="block">
					Annulla
				</ion-button>
				<ion-button (click)="deleteStory(swiperRef?.nativeElement?.swiper.slides[this.currentIndex].id);modal.dismiss();"
					class="mt-2"
					shape="round"
					color="primary"
					expand="block">
					Conferma
				</ion-button>
			</div>
		</div>
	</ng-template>
</ion-modal>
