<div>
  <ion-card button
    class="easycard"
    style="background: var(--color-primary-300);"
    (click)="events.emit()">
    <div class="header">
      <div>{{'APP.SUGGEST_BUTTONS.UNTIL_SUNDAY' | translate}}</div>
      <div class="ion-text-right">
        <ion-icon color="light"
          name="arrow-forward-sharp"></ion-icon>
      </div>
    </div>
    <div class="footer">
      {{'APP.SUGGEST_BUTTONS.UNTIL_SUNDAY_sub' | translate}}
      <font style="text-decoration: underline;">{{city}}</font>
    </div>
  </ion-card>
</div>
<div class="mt-4">
  <ion-card button
    class="easycard"
    style="background: var(--color-primary-500);"
    (click)="clubs.emit()">
    <div class="header">
      <div>{{'APP.SUGGEST_BUTTONS.KNOW_CLUBS' | translate}}</div>
      <div class="ion-text-right">
        <ion-icon color="light"
          name="arrow-forward-sharp"></ion-icon>
      </div>
    </div>
    <div class="footer">
      {{'APP.SUGGEST_BUTTONS.KNOW_CLUBS_SUB' | translate}}
    </div>
  </ion-card>
</div>
