<swiper-container #swiper
	pagination="false"
	slides-per-view="auto"
	speed="150000"
	free-mode="true">

	<swiper-slide (click)="newStory.emit()">
		<div style="width: fit-content; margin-right: 1rem; margin-left: 0">
			<div id="new-story"
				class="w-12 h-12 mx-auto my-0">
				<ion-icon name="add"></ion-icon>
			</div>
			<div class="mt-1"
				style="text-align: center;">
				<small>
					{{'APP.STORIES_WIDGET.NEW' | translate}}
				</small>
			</div>
		</div>
	</swiper-slide>
	<swiper-slide *ngIf="users[authManager.user?.id!]"
		(click)="onAvatarClick(users[authManager.user?.id!])">
		<div style="width: fit-content; border-right: 1px solid var(--ion-color-light);padding-right: 1rem">
			<ion-avatar style="margin: 0 auto;">
				<img [src]="authManager.user?.profileImage?.url || 'assets/icons/guy-walk.svg'"
					style="object-fit: cover;"
					onerror="src = 'assets/icons/guy-walk.svg'; style.objectFit = 'contain'">
			</ion-avatar>
			<div class="mt-1"
				style="text-align: center;">
				<small>
					{{authManager.user?.firstName}} {{authManager.user?.lastName}}
				</small>
			</div>
		</div>
	</swiper-slide>
	<swiper-slide *ngFor="let kv of userKeyValue; let i = index"
		(click)="onAvatarClick(kv.value)">
		<div style="width: fit-content;">
			<ion-avatar style="margin: 0 auto;">
				<img [src]="kv.value.user?.profileImage?.url"
					style="object-fit: cover;">
			</ion-avatar>
			<div class="mt-1"
				style="text-align: center;">
				<small>
					{{kv.value.user?.firstName}} {{kv.value.user?.lastName}}
				</small>
			</div>
		</div>
	</swiper-slide>
</swiper-container>
