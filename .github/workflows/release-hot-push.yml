name: Copy files with SCP

on:
  push:
    branches:
      - releases
  workflow_dispatch:

jobs:

  copy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Build image
      run: npm i && npm run build
    - uses: dkershner6/post-api-call-action@v1
      with:
        url: https://api.easydance.app/attributes/app-version
        headers: '{"Content-Type": "application/json", "API-KEY": "1b4f951d-1fde-44a6-acf6-b22dd85902b8"}'  # Intestazioni della richiesta (JSON)
    - name: get version
      id: getVersion
      uses: tyrrrz/action-http-request@master
      with:
        url: https://api.easydance.app/attributes/app-version
        method: GET
    - name: Print outputs
      run: echo "${{ steps.getVersion.outputs.body }}"
    - uses: montudor/action-zip@v1
      with:
        args: zip -qq -r ${{ steps.getVersion.outputs.body }}build.zip www
    - name: copy file via ssh password s
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DESTINATION_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.DESTINATION_SSH_PORT }}
        source: ${{ steps.getVersion.outputs.body }}build.zip
        target: /var/lib/docker/volumes/easydance-production_static/_data/releases
