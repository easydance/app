name: Copy files with SCP

on:
  push:
    branches:
      - releases
  workflow_dispatch:

jobs:

  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: dkershner6/post-api-call-action@v1
        with:
          url: https://api.easydance.app/attributes/app-version
          headers: '{"Content-Type": "application/json", "API-KEY": "1b4f951d-1fde-44a6-acf6-b22dd85902b8"}'  # Intestazioni della richiesta (JSON)
  
  copy:
    needs: [ update-version ]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Build image
      run: npm i && npm run build
    - uses: montudor/action-zip@v1
      with:
        args: zip -qq -r build.zip www
    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass
    - name: Pub
      run: sshpass -p "!0dd4stud10@2023!" scp -r /build.zip appreleaser@149.62.186.238:/var/lib/docker/volumes/easydance-production_static/_data/releases
