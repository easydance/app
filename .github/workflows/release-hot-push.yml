name: Copy files with SCP

on:
  push:
    branches:
      - releases
  workflow_dispatch:

jobs:

  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: dkershner6/post-api-call-action@v1
        with:
          url: https://api.easydance.app/attributes/app-version
          headers: '{"Content-Type": "application/json", "API-KEY": "1b4f951d-1fde-44a6-acf6-b22dd85902b8"}'  # Intestazioni della richiesta (JSON)
  
  copy:
    needs: [ update-version ]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Build image
      run: npm i && npm run build
    - uses: montudor/action-zip@v1
      with:
        args: zip -qq -r build.zip www
    - name: Deploy to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DESTINATION_HOST }} # Your server address to access it by SSH.
        username: 'root' # Your server username
        password: ${{ secrets.PASSWORD }} # Server password from Secrets
        source: ${{ github.workspace }}/build.zip
        target: /var/lib/docker/volumes/easydance-production_static/_data # Specify the path of the target folder on the server (e.g., /var/www/html/front/)
        strip_components: 2# Removes a specified number of directory components (folders) from the beginning of a file path.
                             # This can be used to deploy only specific folders and files.
