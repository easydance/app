name: Copy files with SCP

on:
  push:
    branches:
      - releases
  workflow_dispatch:

jobs:

  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: dkershner6/post-api-call-action@v1
        with:
          url: https://api.easydance.app/attributes/app-version
          headers: '{"Content-Type": "application/json", "API-KEY": "1b4f951d-1fde-44a6-acf6-b22dd85902b8"}'  # Intestazioni della richiesta (JSON)
  
  copy:
    needs: [ update-version ]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Build image
      run: npm i && npm run build
    - uses: montudor/action-zip@v1
      with:
        args: zip -qq -r build.zip www
    - name: Publish
      uses: nogsantos/scp-deploy@master
      with:
        src: build.zip
        host: 149.62.186.238
        remote: /var/lib/docker/volumes/easydance-production_static/_data/releases
        port: 22
        user: appreleaser
        key: ssh-rsa  simone@oddastudio.com
